<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply for Leave | Leave Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div id="flash-container" style="position: fixed; top: 20px; right: 20px; z-index: 1050; min-width: 300px;">
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-lg mb-2 flash-message" role="alert">
                    <span>{{ message }}</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>

        <script>
            setTimeout(function() {
                let alerts = document.querySelectorAll('.flash-message');
                alerts.forEach(function(alert) {
                    let bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 4000);
        </script>
    {% endif %}
{% endwith %}

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">Leave Application</h3>
            <span class="badge bg-secondary">{{ current_user.company }}</span>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Leave Type</label>
                <select name="leave_type" class="form-select" required>
                    <option value="Annual">Annual Leave (Remaining: {{ current_user.annual_leave_balance }} days)</option>
                    <option value="Sick">Sick Leave (Remaining: {{ current_user.sick_leave_balance }} days)</option>
                    <option value="Casual">Casual Leave (Remaining: {{ current_user.casual_leave_balance }} days)</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Reason for Leave</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="Brief explanation..." required></textarea>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
                <button type="submit" class="btn btn-primary">Submit Application</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
