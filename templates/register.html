<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Leave System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-center mb-4">Employee Registration</h3>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div id="flash-container" style="position: fixed; top: 20px; right: 20px; z-index: 1050; min-width: 300px;">
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-lg mb-2 flash-message" role="alert">
                    <span>{{ message }}</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
        <script>
            setTimeout(function() {
                let alerts = document.querySelectorAll('.flash-message');
                alerts.forEach(function(alert) {
                    let bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 4000);
        </script>
    {% endif %}
{% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Company</label>
                <select name="company" class="form-select" required>
                    <option value="Dukaloco">Dukaloco</option>
                    <option value="KP">KP</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Employee ID</label>
                <input type="text" name="employee_id" class="form-control" placeholder="e.g., DL-001 or KP-001" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 text-center">Already registered? <a href="{{ url_for('login') }}">Log in here</a></p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
